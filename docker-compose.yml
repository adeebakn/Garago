services:
  postgres:
    image: postgres:17
    container_name: autoerp-postgres
    environment:
      POSTGRES_USER: autoerp
      POSTGRES_PASSWORD: autoerp
      POSTGRES_DB: autoerp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: autoerp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
