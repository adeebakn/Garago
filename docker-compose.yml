services:
  postgres:
    image: postgres:17
    container_name: garago-postgres
    environment:
      POSTGRES_USER: garago
      POSTGRES_PASSWORD: garago
      POSTGRES_DB: garago
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: garago-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
